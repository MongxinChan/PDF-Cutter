# Builds the desktop app for macOS and Windows.
#   - Push a tag like v1.0.0  -> builds both and publishes a GitHub Release with the installers.
#   - Run manually (Actions -> "构建桌面版" -> Run workflow) -> builds only; download from the run's Artifacts.
name: 构建桌面版

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac-arm64
            target: aarch64-apple-darwin
            files: dist/*.dmg
          - os: macos-15-intel
            name: mac-x64
            target: x86_64-apple-darwin
            files: dist/*.dmg
          - os: windows-latest
            name: windows
            target: x86_64-pc-windows-msvc
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: 安装依赖
        run: npm ci

      - name: 验证网页和桌面导出接口
        if: runner.os == 'Windows'
        run: |
          npx playwright install chromium
          npm test

      - name: 准备图标和资源
        run: |
          npm run icon
          npm run prepare:web

      - name: 验证文件保存与重名保护
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: 打包
        run: |
          npm run tauri -- build --ci --target ${{ matrix.target }} -- --locked
          node scripts/collect-artifacts.js
        env:
          # Build unsigned; macOS packaging must not prompt for a signing identity.
          APPLE_SIGNING_IDENTITY: "-"

      - name: 保存构建产物
        uses: actions/upload-artifact@v7
        with:
          name: pdf-cutter-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - run: ls -la out

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          files: out/*
          name: PDF 裁纸台 ${{ github.ref_name }}
          body: |
            ## v1.0.2 更新

            - 新增英文界面，右上角可切换简体中文 / English，并记住语言选择。
            - 切换语言保留已选 PDF、切分设置和结果；进度、校验提示和下载操作同步切换语言。
            - 优化小窗口布局；保留 Tauri 2 轻量打包、离线切分、批量保存、ZIP 导出和同名文件保护。

            ## What's new

            - English and Simplified Chinese interfaces with a language button in the top-right corner and a saved language preference.
            - Switch languages without losing your PDF, settings or split files. Progress, validation and download messages are translated too.
            - Improved layout for narrow windows. Local PDF processing, batch saving and ZIP export remain available offline.

            ## 下载哪个文件？

            - **Windows**：`pdf-cutter-…-windows-setup.exe` 是安装版；`pdf-cutter-…-windows-portable.exe` 免安装。需要 WebView2，安装版会在缺失时联网安装；免安装版需系统已安装 WebView2。
            - **macOS（Apple 芯片，M1 及以后）**：`pdf-cutter-…-mac-arm64.dmg`
            - **macOS（Intel 芯片）**：`pdf-cutter-…-mac-x64.dmg`

            这个 App 没有购买开发者签名证书，第一次打开时系统可能会拦截，处理方法见仓库 README 的“第一次打开被拦截”一节。

            Windows requires WebView2; the installer downloads it if missing. macOS packages are provided for Apple Silicon and Intel. These apps are unsigned; see the English README for first-launch instructions.
